<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOL L5IBRA Admin</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

<header class="topbar">
  <a class="logo" href="index.html">MOL <span>L5IBRA</span></a>
  <a class="admin-btn" href="index.html">SITE</a>
</header>

<main class="section">

  <!-- LOGIN -->
  <section id="login-section">
    <div class="section-title">
      <p class="eyebrow">CONTROL CENTER</p>
      <h2>Admin Login</h2>
    </div>

    <div class="card" style="max-width:500px;">
      <h3>Login</h3>

      <form id="login-form">
        <input
          id="email"
          type="email"
          placeholder="Admin email"
          required
          style="width:100%;padding:12px;margin:8px 0;"
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
          style="width:100%;padding:12px;margin:8px 0;"
        >

        <button class="cta" type="submit">LOGIN</button>
      </form>

      <p id="login-message"></p>
    </div>
  </section>

  <!-- ADMIN PANEL -->
  <section id="admin-section" style="display:none;">

    <div class="section-title">
      <p class="eyebrow">CONTROL CENTER</p>
      <h2>Admin Panel</h2>
    </div>

    <div class="card" style="max-width:700px;">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h3>Manage Content</h3>
        <button id="logout-btn" class="cta" type="button">LOGOUT</button>
      </div>

      <hr>

      <form id="content-form">

        <label>Type</label>
        <select id="type" required style="width:100%;padding:12px;margin:8px 0;">
          <option value="news">News</option>
          <option value="legend">Legend</option>
          <option value="product">Product</option>
        </select>

        <label>Title</label>
        <input
          id="title"
          type="text"
          placeholder="Title"
          required
          style="width:100%;padding:12px;margin:8px 0;"
        >

        <label>Text</label>
        <textarea
          id="text"
          placeholder="Content"
          rows="5"
          style="width:100%;padding:12px;margin:8px 0;"
        ></textarea>

        <label>Tag</label>
        <input
          id="tag"
          type="text"
          placeholder="Tag"
          style="width:100%;padding:12px;margin:8px 0;"
        >

        <label>Price</label>
        <input
          id="price"
          type="text"
          placeholder="Price"
          style="width:100%;padding:12px;margin:8px 0;"
        >

        <button class="cta" type="submit">ADD CONTENT</button>

      </form>

      <p id="content-message"></p>

    </div>

    <div class="card" style="max-width:900px;margin-top:25px;">
      <h3>Current Content</h3>
      <div id="content-list">Loading...</div>
    </div>

  </section>

</main>

<script>
  const supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );

  const ADMIN_EMAIL = "ayoub.ajboun10@gmail.com";

  const loginSection = document.getElementById("login-section");
  const adminSection = document.getElementById("admin-section");

  const loginForm = document.getElementById("login-form");
  const loginMessage = document.getElementById("login-message");

  const contentForm = document.getElementById("content-form");
  const contentMessage = document.getElementById("content-message");

  const contentList = document.getElementById("content-list");
  const logoutBtn = document.getElementById("logout-btn");

  async function checkSession() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      return;
    }

    if (data.session && data.session.user.email === ADMIN_EMAIL) {
      showAdmin();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    loginSection.style.display = "block";
    adminSection.style.display = "none";
  }

  function showAdmin() {
    loginSection.style.display = "none";
    adminSection.style.display = "block";
    loadContent();
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginMessage.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email !== ADMIN_EMAIL) {
      loginMessage.textContent = "This account is not an admin account.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginMessage.textContent = error.message;
      return;
    }

    if (!data.user || data.user.email !== ADMIN_EMAIL) {
      await supabaseClient.auth.signOut();
      loginMessage.textContent = "Access denied.";
      return;
    }

    loginMessage.textContent = "";
    showAdmin();
  });

  logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    showLogin();
  });

  contentForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    contentMessage.textContent = "Adding...";

    const type = document.getElementById("type").value;
    const title = document.getElementById("title").value.trim();
    const text = document.getElementById("text").value.trim();
    const tag = document.getElementById("tag").value.trim();
    const price = document.getElementById("price").value.trim();

    const { data: sessionData } = await supabaseClient.auth.getSession();

    if (!sessionData.session) {
      contentMessage.textContent = "You are not logged in.";
      showLogin();
      return;
    }

    if (sessionData.session.user.email !== ADMIN_EMAIL) {
      contentMessage.textContent = "Access denied.";
      return;
    }

    const { error } = await supabaseClient
      .from("content")
      .insert({
        type,
        title,
        text: text || null,
        tag: tag || null,
        price: price || null
      });

    if (error) {
      contentMessage.textContent = error.message;
      return;
    }

    contentMessage.textContent = "Content added successfully ✅";
    contentForm.reset();
    loadContent();
  });

  async function loadContent() {
    contentList.innerHTML = "Loading...";

    const { data, error } = await supabaseClient
      .from("content")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      contentList.textContent = error.message;
      return;
    }

    if (!data || data.length === 0) {
      contentList.textContent = "No content yet.";
      return;
    }

    contentList.innerHTML = "";

    data.forEach((item) => {
      const wrapper = document.createElement("div");

      wrapper.style.borderBottom = "1px solid #444";
      wrapper.style.padding = "15px 0";

      wrapper.innerHTML = `
        <strong>${escapeHtml(item.title)}</strong>
        <div>${escapeHtml(item.type)}</div>
        <small>${escapeHtml(item.tag || "")}</small>
        <p>${escapeHtml(item.text || "")}</p>
        ${item.price ? `<span>${escapeHtml(item.price)}</span>` : ""}
      `;

      contentList.appendChild(wrapper);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  checkSession();
</script>

</body>
</html>
