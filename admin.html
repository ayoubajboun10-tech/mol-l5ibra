<script>

const supabaseClient =
  window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );


/* IMPORTANT:
   Only this Google account can access Admin.
*/

const ADMIN_EMAIL =
  "ayoub.ajboun10@gmail.com";


const loginSection =
  document.getElementById(
    "login-section"
  );

const adminSection =
  document.getElementById(
    "admin-section"
  );

const googleAdminBtn =
  document.getElementById(
    "google-admin-btn"
  );

const loginMessage =
  document.getElementById(
    "login-message"
  );

const contentForm =
  document.getElementById(
    "content-form"
  );

const contentMessage =
  document.getElementById(
    "content-message"
  );

const contentList =
  document.getElementById(
    "content-list"
  );

const logoutBtn =
  document.getElementById(
    "logout-btn"
  );


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

  loginSection.style.display =
    "block";

  adminSection.style.display =
    "none";
}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin() {

  loginSection.style.display =
    "none";

  adminSection.style.display =
    "block";

  loadContent();
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

googleAdminBtn.addEventListener(
  "click",
  async () => {

    loginMessage.textContent =
      "Connecting to Google...";


    googleAdminBtn.disabled =
      true;


    const {
      error
    } =
      await supabaseClient
        .auth
        .signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              window.location.origin +
              window.location.pathname

          }

        });


    if (error) {

      console.error(error);

      loginMessage.textContent =
        error.message;

      googleAdminBtn.disabled =
        false;
    }

  }
);


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (error) {

    console.error(error);

    showLogin();

    return;
  }


  const user =
    data.session?.user;


  if (!user) {

    showLogin();

    return;
  }


  if (
    user.email !== ADMIN_EMAIL
  ) {

    await supabaseClient
      .auth
      .signOut();


    showLogin();

    loginMessage.textContent =
      "This Google account is not authorized as admin.";

    return;
  }


  showAdmin();
}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event === "SIGNED_IN" &&
      session?.user
    ) {

      if (
        session.user.email !==
        ADMIN_EMAIL
      ) {

        await supabaseClient
          .auth
          .signOut();

        showLogin();

        loginMessage.textContent =
          "Access denied.";

        return;
      }


      showAdmin();
    }


    if (
      event === "SIGNED_OUT"
    ) {

      showLogin();
    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    await supabaseClient
      .auth
      .signOut();

    showLogin();

  }
);


/* =====================================================
   ADD CONTENT
===================================================== */

contentForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    contentMessage.textContent =
      "Adding...";


    const {
      data: sessionData
    } =
      await supabaseClient
        .auth
        .getSession();


    const user =
      sessionData.session?.user;


    if (!user) {

      contentMessage.textContent =
        "You are not logged in.";

      showLogin();

      return;
    }


    if (
      user.email !==
      ADMIN_EMAIL
    ) {

      contentMessage.textContent =
        "Access denied.";

      return;
    }


    const type =
      document
        .getElementById("type")
        .value;


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const text =
      document
        .getElementById("text")
        .value
        .trim();


    const tag =
      document
        .getElementById("tag")
        .value
        .trim();


    const price =
      document
        .getElementById("price")
        .value
        .trim();


    const {
      error
    } =
      await supabaseClient
        .from("content")
        .insert({

          type,
          title,
          text: text || null,
          tag: tag || null,
          price: price || null

        });


    if (error) {

      console.error(error);

      contentMessage.textContent =
        error.message;

      return;
    }


    contentMessage.textContent =
      "Content added successfully ✅";


    contentForm.reset();

    loadContent();

  }
);


/* =====================================================
   LOAD CONTENT
===================================================== */

async function loadContent() {

  contentList.innerHTML =
    "Loading...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("content")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    contentList.textContent =
      error.message;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    contentList.textContent =
      "No content yet.";

    return;
  }


  contentList.innerHTML =
    "";


  data.forEach(
    (item) => {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.style.borderBottom =
        "1px solid #444";


      wrapper.style.padding =
        "15px 0";


      wrapper.innerHTML = `

        <strong>
          ${escapeHtml(item.title)}
        </strong>

        <div>
          ${escapeHtml(item.type)}
        </div>

        <small>
          ${escapeHtml(item.tag || "")}
        </small>

        <p>
          ${escapeHtml(item.text || "")}
        </p>

        ${
          item.price
            ? `<span>${escapeHtml(item.price)}</span>`
            : ""
        }

      `;


      contentList.appendChild(
        wrapper
      );

    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* START */

checkSession();

</script>
